name: 缺陷报告
description: 记录可复现的软件或文档问题
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境或文档版本
  - type: textarea
    id: evidence
    attributes:
      label: 证据与影响
      description: 可以附截图或日志；请去除密钥和真实用户资料。
