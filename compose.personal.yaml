name: interviewlab-personal
x-app: &app
  build:
    context: .
    dockerfile: Dockerfile.personal
  environment: &env
    NODE_ENV: development
    AUTH_ENABLED: 'true'
    BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Use --env-file .env.personal}
    DATABASE_URL: postgresql://interviewlab:interviewlab_local@postgres:5432/interviewlab
    PUBLIC_ORIGIN: http://127.0.0.1:3000
    API_HOST: 0.0.0.0
    API_PORT: '3001'
    BACKEND_ORIGIN: http://api:3001
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: interviewlab
      POSTGRES_PASSWORD: interviewlab_local
      POSTGRES_DB: interviewlab
    volumes:
      - personal_database:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U interviewlab -d interviewlab']
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    <<: *app
    command: npm run db:migrate
    depends_on:
      postgres:
        condition: service_healthy
  api:
    <<: *app
    command: npm run dev:api
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    <<: *app
    working_dir: /app/code/frontend
    command: node /app/node_modules/next/dist/bin/next dev --hostname 0.0.0.0
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      api:
        condition: service_started
volumes:
  personal_database:
